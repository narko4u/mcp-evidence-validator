name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run tests
        run: pytest
      - name: Verify CLI entry point
        run: mcp-ev-validate --version

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all PR commits
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          for c in $(git rev-list --no-merges "$BASE_SHA..HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by:'; then
              echo "Missing Signed-off-by trailer in commit $c"
              echo "Amend with: git commit --amend -s"
              exit 1
            fi
          done
          echo "All commits carry Signed-off-by."
